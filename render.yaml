services:
  # 1. React / Vite Frontend (Static Site with global CDN & HTTPS - 100% Free)
  - type: web
    name: silent-alarm-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: silent-alarm-api
          property: host
      - key: VITE_SOCKET_URL
        fromService:
          type: web
          name: silent-alarm-api
          property: host

  # 2. Node.js Backend API + Socket.IO (Persistent Web Service - Free Tier)
  - type: web
    name: silent-alarm-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        fromService:
          type: web
          name: silent-alarm-client
          property: host
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: silent-alarm-ml
          property: host

  # 3. Python ML Microservice (FastAPI - Free Tier)
  - type: web
    name: silent-alarm-ml
    runtime: python
    plan: free
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
